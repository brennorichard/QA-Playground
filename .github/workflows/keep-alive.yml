name: Keep Supabase Ativo

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping Supabase API
        run: |
          curl -X GET "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/herois?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_KEY }}"
        continue-on-error: true
